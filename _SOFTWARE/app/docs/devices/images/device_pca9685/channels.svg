<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 180" width="580" height="180" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12">
  <title>PCA9685 channels on the runIT board</title>
  <rect width="580" height="180" fill="#ffffff"/>
  <rect x="20" y="16" width="540" height="122" rx="8" fill="#f4f6f8" stroke="#9aa5b1"/>
  <text x="36" y="40" font-size="13" font-weight="600" fill="#1f2933">PCA9685 - one PWM frequency for all 16 channels</text>
  <g id="servo" fill="#dbeafe" stroke="#3b82f6">
    <rect x="36" y="54" width="26" height="26" rx="4"/><rect x="68" y="54" width="26" height="26" rx="4"/>
    <rect x="100" y="54" width="26" height="26" rx="4"/><rect x="132" y="54" width="26" height="26" rx="4"/>
    <rect x="164" y="54" width="26" height="26" rx="4"/><rect x="196" y="54" width="26" height="26" rx="4"/>
    <rect x="228" y="54" width="26" height="26" rx="4"/><rect x="260" y="54" width="26" height="26" rx="4"/>
  </g>
  <g id="bridge" fill="#fde7d3" stroke="#e5933a">
    <rect x="298" y="54" width="26" height="26" rx="4"/><rect x="330" y="54" width="26" height="26" rx="4"/>
    <rect x="362" y="54" width="26" height="26" rx="4"/><rect x="394" y="54" width="26" height="26" rx="4"/>
    <rect x="426" y="54" width="26" height="26" rx="4"/><rect x="458" y="54" width="26" height="26" rx="4"/>
    <rect x="490" y="54" width="26" height="26" rx="4"/><rect x="522" y="54" width="26" height="26" rx="4"/>
  </g>
  <g font-size="10" text-anchor="middle" fill="#1f2933">
    <text x="49" y="71">0</text><text x="81" y="71">1</text><text x="113" y="71">2</text><text x="145" y="71">3</text>
    <text x="177" y="71">4</text><text x="209" y="71">5</text><text x="241" y="71">6</text><text x="273" y="71">7</text>
    <text x="311" y="71">8</text><text x="343" y="71">9</text><text x="375" y="71">10</text><text x="407" y="71">11</text>
    <text x="439" y="71">12</text><text x="471" y="71">13</text><text x="503" y="71">14</text><text x="535" y="71">15</text>
  </g>
  <path d="M36 90 H286" stroke="#3b82f6" stroke-width="2"/>
  <path d="M298 90 H548" stroke="#e5933a" stroke-width="2"/>
  <text x="161" y="108" text-anchor="middle" fill="#1f2933">CH 0-7: free, e.g. servos (~50 Hz)</text>
  <text x="423" y="108" text-anchor="middle" fill="#1f2933">CH 8-15: H-bridge DRV8962 #2 (~1 kHz)</text>
  <text x="36" y="127" font-size="11" fill="#52606d">Both groups share one frequency: pick the one the connected load needs.</text>
  <text x="20" y="162" font-size="11" fill="#52606d">Output enable (OE, active-low) is TCA6424A pin 0 on the runIT board.</text>
</svg>
